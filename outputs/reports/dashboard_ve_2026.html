<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>VE 2026 — Dashboard</title>
  <style>
    body { margin: 0; padding: 24px; background: #0b0e16; font-family: 'Segoe UI', sans-serif; color: #e0e0e0; }
    h1 { text-align: center; color: #00d4ff; margin-bottom: 6px; }
    .sub { text-align: center; color: #666; font-size: .85rem; margin-bottom: 32px; }
    .card { background: #12122a; border: 1px solid #2a2a4a; border-radius: 12px; padding: 20px; margin-bottom: 32px; max-width: 1400px; margin-left: auto; margin-right: auto; }
    .card h2 { display: flex; justify-content: space-between; align-items: center; margin: 0 0 14px 0; font-size: 1.1rem; }
    .card h2 span { font-size: 1.5rem; font-weight: 700; }
    .pos { color: #f87171; }
    .neg { color: #4ade80; }
    img { width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>VE 2026 — Charge Intelligente S_BE_opt</h1>
  <p class="sub">forecast_volume &gt; 200 AND afrr &gt; 50% AND mfrr &gt; 50% &nbsp;|&nbsp; Jan → Mai 2026</p>

  <div class="card">
    <h2>VE Belgique 2026 <span class="pos">+86.86 EUR</span></h2>
    <img src="ve_be_2026.png">
  </div>

  <div class="card">
    <h2>VE France 2026 <span class="neg">−11.18 EUR</span></h2>
    <img src="ve_fr_2026.png">
  </div>
</body>
</html>
